name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Verify production API
        run: |
          node --input-type=module <<'JS'
          const url = 'https://badguard.nizabentley397.workers.dev/api/health';
          let lastStatus = 'not requested';

          for (let attempt = 1; attempt <= 6; attempt += 1) {
            const response = await fetch(url).catch((error) => {
              lastStatus = error.message;
              return null;
            });

            if (response?.ok) {
              console.log(await response.text());
              process.exit(0);
            }

            lastStatus = response?.status ?? lastStatus;
            await new Promise((resolve) => setTimeout(resolve, attempt * 5000));
          }

          throw new Error(`BadGuard health check failed after retries: ${lastStatus}`);
          JS
