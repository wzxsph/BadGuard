name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          npm ci
          uv sync --locked

      - name: Check
        run: npm run check

      - name: Resolve Cloudflare namespace
        run: |
          KV_NAMESPACE_ID="$(node --input-type=module <<'JS'
          import fs from 'node:fs';
          const toml = fs.readFileSync('wrangler.toml', 'utf8');
          const match = toml.match(/\[\[kv_namespaces\]\][\s\S]*?binding\s*=\s*"SIGNAL_KV"[\s\S]*?id\s*=\s*"([^"]+)"/);
          if (!match) throw new Error('SIGNAL_KV id not found in wrangler.toml');
          console.log(match[1]);
          JS
          )"
          echo "KV_NAMESPACE_ID=$KV_NAMESPACE_ID" >> "$GITHUB_ENV"

      - name: Publish static company profiles to KV
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/publish_company_profiles.mjs --input data/company-profiles.json

      - name: Validate Worker bundle size
        run: npx wrangler deploy --dry-run --outdir dist/worker

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Verify production API
        run: |
          node --input-type=module <<'JS'
          const url = 'https://badguard.nizabentley397.workers.dev/api/health';
          let lastStatus = 'not requested';

          for (let attempt = 1; attempt <= 6; attempt += 1) {
            const response = await fetch(url).catch((error) => {
              lastStatus = error.message;
              return null;
            });

            if (response?.ok) {
              console.log(await response.text());
              process.exit(0);
            }

            lastStatus = response?.status ?? lastStatus;
            await new Promise((resolve) => setTimeout(resolve, attempt * 5000));
          }

          throw new Error(`BadGuard health check failed after retries: ${lastStatus}`);
          JS
