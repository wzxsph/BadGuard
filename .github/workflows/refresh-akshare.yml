name: Refresh AkShare Signals

on:
  workflow_dispatch:
    inputs:
      scan_limit:
        description: Number of active A-share stocks to scan; use 0 for all.
        required: true
        default: "80"
      publish_production:
        description: Publish to production keys instead of staging.
        required: true
        default: "false"
      force_publish:
        description: Overwrite an existing production snapshot for the same market date.
        required: true
        default: "false"
  schedule:
    - cron: "30 7 * * 1-5"

permissions:
  contents: read

concurrency:
  group: refresh-akshare-signals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build AkShare signal snapshot
        env:
          PUBLISH_PRODUCTION: ${{ github.event_name == 'schedule' || github.event.inputs.publish_production == 'true' }}
        run: |
          SCAN_LIMIT="${{ github.event.inputs.scan_limit }}"
          if [ -z "$SCAN_LIMIT" ]; then
            SCAN_LIMIT=1000
          fi

          BUILD_MODE=staging
          if [ "$PUBLISH_PRODUCTION" = "true" ]; then
            BUILD_MODE=production
          fi

          python scripts/build_akshare_snapshot.py \
            --output data/latest.json \
            --universe-source realtime \
            --history-source eastmoney \
            --limit "$SCAN_LIMIT" \
            --max-workers 8 \
            --sleep 0.02 \
            --build-mode "$BUILD_MODE"

      - name: Install Worker dependencies
        run: npm ci

      - name: Validate snapshot
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';

          const snapshot = JSON.parse(await fs.readFile('data/latest.json', 'utf8'));
          const topKinds = new Set(snapshot.topRows.map((row) => row.signalId));

          if (snapshot.source !== 'provider') {
            throw new Error(`Unexpected source: ${snapshot.source}`);
          }

          if (snapshot.boards.length !== 4) {
            throw new Error(`Expected 4 boards, got ${snapshot.boards.length}`);
          }

          if (topKinds.has('risk-filter')) {
            throw new Error('risk-filter rows must not appear in topRows');
          }

          if (!snapshot.meta || typeof snapshot.meta.stockCount !== 'number' || typeof snapshot.meta.scanLimit !== 'number') {
            throw new Error('snapshot.meta must include stockCount and scanLimit');
          }

          await fs.appendFile(process.env.GITHUB_ENV, `MARKET_DATE=${snapshot.marketDate}\n`);

          console.log(JSON.stringify({
            marketDate: snapshot.marketDate,
            topRows: snapshot.topRows.length,
            meta: snapshot.meta,
            boards: snapshot.boards.map((board) => [board.id, board.rows.length])
          }, null, 2));
          JS

      - name: Upload snapshot to Workers KV
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLISH_PRODUCTION: ${{ github.event_name == 'schedule' || github.event.inputs.publish_production == 'true' }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish == 'true' }}
        run: |
          KV_NAMESPACE_ID="$(node --input-type=module <<'JS'
          import fs from 'node:fs';

          const toml = fs.readFileSync('wrangler.toml', 'utf8');
          const match = toml.match(/\[\[kv_namespaces\]\][\s\S]*?binding\s*=\s*"SIGNAL_KV"[\s\S]*?id\s*=\s*"([^"]+)"/);
          if (!match) {
            throw new Error('SIGNAL_KV id not found in wrangler.toml');
          }

          console.log(match[1]);
          JS
          )"

          if [ "$PUBLISH_PRODUCTION" != "true" ]; then
            npx wrangler kv key put staging-signal-snapshot --path data/latest.json --namespace-id "$KV_NAMESPACE_ID" --remote
            echo "VERIFY_KEY=staging-signal-snapshot" >> "$GITHUB_ENV"
            exit 0
          fi

          DATED_KEY="signal-snapshot:${MARKET_DATE}"
          if npx wrangler kv key get "$DATED_KEY" --namespace-id "$KV_NAMESPACE_ID" --remote >/tmp/badguard-existing.json 2>/tmp/badguard-kv-get.err; then
            if [ "$FORCE_PUBLISH" != "true" ]; then
              echo "Production snapshot already exists for ${MARKET_DATE}; not overwriting ${DATED_KEY}."
              echo "VERIFY_KEY=latest-signal-snapshot" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          npx wrangler kv key put "$DATED_KEY" --path data/latest.json --namespace-id "$KV_NAMESPACE_ID" --remote
          npx wrangler kv key put latest-signal-snapshot --path data/latest.json --namespace-id "$KV_NAMESPACE_ID" --remote
          echo "VERIFY_KEY=latest-signal-snapshot" >> "$GITHUB_ENV"

      - name: Verify published snapshot
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          KV_NAMESPACE_ID="$(node --input-type=module <<'JS'
          import fs from 'node:fs';

          const toml = fs.readFileSync('wrangler.toml', 'utf8');
          const match = toml.match(/\[\[kv_namespaces\]\][\s\S]*?binding\s*=\s*"SIGNAL_KV"[\s\S]*?id\s*=\s*"([^"]+)"/);
          if (!match) {
            throw new Error('SIGNAL_KV id not found in wrangler.toml');
          }

          console.log(match[1]);
          JS
          )"

          if [ "$VERIFY_KEY" = "staging-signal-snapshot" ]; then
            npx wrangler kv key get "$VERIFY_KEY" --namespace-id "$KV_NAMESPACE_ID" --remote >/tmp/badguard-verify.json
            node --input-type=module -e '
          import fs from "node:fs";

          const snapshot = JSON.parse(fs.readFileSync("/tmp/badguard-verify.json", "utf8"));
          console.log(JSON.stringify({
            key: process.env.VERIFY_KEY,
            marketDate: snapshot.marketDate,
            topRows: snapshot.topRows.length,
            buildMode: snapshot.meta?.buildMode
          }, null, 2));

          if (snapshot.meta?.buildMode !== "staging") {
            throw new Error("staging verification expected buildMode=staging");
          }
          '
            exit 0
          fi

          node --input-type=module <<'JS'
          const url = 'https://badguard.nizabentley397.workers.dev/api/signals';
          let lastStatus = 'not requested';

          for (let attempt = 1; attempt <= 6; attempt += 1) {
            const response = await fetch(url).catch((error) => {
              lastStatus = error.message;
              return null;
            });

            if (response?.ok) {
              const snapshot = await response.json();
              console.log(JSON.stringify({
                marketDate: snapshot.marketDate,
                topRows: snapshot.topRows.length,
                source: snapshot.source
              }, null, 2));
              process.exit(0);
            }

            lastStatus = response?.status ?? lastStatus;
            await new Promise((resolve) => setTimeout(resolve, attempt * 5000));
          }

          throw new Error(`BadGuard API check failed after retries: ${lastStatus}`);
          JS
